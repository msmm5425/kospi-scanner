name: KOSPI 08:00-21:00 Continuous Swing Scan

on:
  schedule:
    # 평일(KST 월~금) 08:00~21:00 무중단 3교대 릴레이 (비혼잡 분 오프셋 + 교대 10~13분 전 선행 기동)
    # 1교대: 07:47 KST (전일 22:47 UTC, 일~목 = 0-4) -> 12:22 KST 인계
    - cron: "47 22 * * 0-4"
    # 2교대: 12:13 KST (03:13 UTC, 월~금 = 1-5) -> 16:47 KST 인계
    - cron: "13 3 * * 1-5"
    # 3교대: 16:37 KST (07:37 UTC, 월~금 = 1-5) -> 21:05 KST 종료
    - cron: "37 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (chart_check_summary: 1회 차트 매수픽 점검+텔레그램 / single_live: 1회 실전 / loop_live: 연속 루프)"
        type: choice
        required: true
        default: "chart_check_summary"
        options:
          - chart_check_summary
          - single_live
          - loop_live
      target_date:
        description: "기준 거래일 YYYY-MM-DD (비워두면 점검 모드에서 최근 거래일 자동 선택)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kospi-scanner-loop
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Restore cached KIS access token
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kospi_token_cache
          key: kis-token-v1-none
          restore-keys: |
            kis-token-v1-
      - name: Ensure 1-day KIS access token
        id: kis_token
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_API_BASE_URL: ${{ vars.KIS_API_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
          KIS_TOKEN_CACHE_PATH: ${{ runner.temp }}/kospi_token_cache/kis_token.json
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "loop_live" ]; then
            python main_token.py --min-ttl-hours 0.5 --github-output
          else
            python main_token.py --min-ttl-hours 13.5 --skip-weekends --github-output
          fi
      - name: Save KIS access token cache
        if: steps.kis_token.outputs.needs_save == 'true' && steps.kis_token.outputs.cache_key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kospi_token_cache
          key: ${{ steps.kis_token.outputs.cache_key }}
      - name: Configure Git for live loop sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run KOSPI 08:00-21:00 scanner
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_API_BASE_URL: ${{ vars.KIS_API_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
          KIS_TOKEN_CACHE_PATH: ${{ runner.temp }}/kospi_token_cache/kis_token.json
          KOSPI_TELEGRAM_TOKEN: ${{ secrets.KOSPI_TELEGRAM_TOKEN }}
          KOSPI_TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" = "chart_check_summary" ]; then
            if [ -n "${{ github.event.inputs.target_date }}" ]; then
              python main_scan.py --dry-run --notify-summary --date "${{ github.event.inputs.target_date }}"
            else
              python main_scan.py --dry-run --notify-summary --latest-trading-day
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" = "single_live" ]; then
            if [ -n "${{ github.event.inputs.target_date }}" ]; then
              python main_scan.py --date "${{ github.event.inputs.target_date }}"
            else
              python main_scan.py
            fi
          else
            if [ "${{ github.event.schedule }}" = "47 22 * * 0-4" ]; then
              SHIFT_END="12:22"
            elif [ "${{ github.event.schedule }}" = "13 3 * * 1-5" ]; then
              SHIFT_END="16:47"
            else
              SHIFT_END="21:05"
            fi
            python main_scan.py --loop --interval-sec 120 --max-minutes 280 --end-kst "$SHIFT_END" --git-sync
          fi
      - name: Final state sync commit
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'chart_check_summary'
        run: |
          git add storage/data/signals_log.json storage/data/learning_profile.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): final scan state sync [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 3
            done
          fi
