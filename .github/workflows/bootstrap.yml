name: KOSPI Walk-Forward Bootstrap Learning

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Walk-forward trading days to replay (e.g. 25)"
        required: false
        default: "25"
      max_stocks:
        description: "Top liquid stocks to prefetch (e.g. 60)"
        required: false
        default: "60"
      dry_run:
        description: "Run without committing updated JSON"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: kospi-scanner-state
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run walk-forward bootstrap learning
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_API_BASE_URL: ${{ vars.KIS_API_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main_bootstrap.py --days "${{ github.event.inputs.days }}" --max-stocks "${{ github.event.inputs.max_stocks }}" --dry-run
          else
            python main_bootstrap.py --days "${{ github.event.inputs.days }}" --max-stocks "${{ github.event.inputs.max_stocks }}"
          fi
      - name: Commit bootstrap learning data
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/data/signals_log.json storage/data/top20_history.json storage/data/pattern_queue.json storage/data/learning_profile.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(learn): bootstrap walk-forward learning state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 3
            done
          fi
