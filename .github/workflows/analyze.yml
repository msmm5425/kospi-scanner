name: KOSPI 15:50 Error Log & TOP20 Analyze

on:
  schedule:
    # 평일 15:47 KST (UTC 06:47, 정시 :50 혼잡 회피)
    - cron: "47 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without committing JSON or sending Telegram"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: kospi-scanner-analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Restore cached KIS access token
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kospi_token_cache
          key: kis-token-v1-none
          restore-keys: |
            kis-token-v1-
      - name: Ensure 1-day KIS access token
        id: kis_token
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_API_BASE_URL: ${{ vars.KIS_API_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
          KIS_TOKEN_CACHE_PATH: ${{ runner.temp }}/kospi_token_cache/kis_token.json
        run: python main_token.py --min-ttl-hours 0.5 --github-output
      - name: Save KIS access token cache
        if: steps.kis_token.outputs.needs_save == 'true' && steps.kis_token.outputs.cache_key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kospi_token_cache
          key: ${{ steps.kis_token.outputs.cache_key }}
      - name: Run 15:50 error log + TOP20 reverse analysis
        env:
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_API_BASE_URL: ${{ vars.KIS_API_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
          KIS_TOKEN_CACHE_PATH: ${{ runner.temp }}/kospi_token_cache/kis_token.json
          KOSPI_TELEGRAM_TOKEN: ${{ secrets.KOSPI_TELEGRAM_TOKEN }}
          KOSPI_TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main_analyze.py --dry-run --bootstrap-if-empty
          else
            python main_analyze.py --bootstrap-if-empty
          fi
      - name: Commit daily analysis logs
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage/data/signals_log.json storage/data/top20_history.json storage/data/pattern_queue.json storage/data/learning_profile.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily error log, top20, and auto-learning [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 3
            done
          fi
